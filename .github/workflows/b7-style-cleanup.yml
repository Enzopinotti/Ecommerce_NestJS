name: B7 style cleanup

on:
  push:
    branches:
      - modernize/2026-final-test-ci
    paths:
      - .github/workflows/b7-style-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Setup pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install from lockfile
        run: npm ci
      - name: Apply one-time formatting and safe lint autofixes
        shell: bash
        run: |
          set -euo pipefail
          npm run format:write
          npm run lint:fix || true
      - name: Report residual lint
        id: residual
        continue-on-error: true
        run: npm run lint
      - name: Verify compiler build and unit suite after autofix
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck:all
          npm run build
          npm run test:unit
      - name: Commit validated mechanical cleanup
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "Enzo Pinotti"
          git config user.email "enzopinottii@gmail.com"
          git add src test
          if git diff --cached --quiet; then
            echo "No formatting/lint cleanup changes to commit."
            exit 0
          fi
          git commit -m "B7: apply validated formatting and lint autofixes"
          git fetch origin modernize/2026-final-test-ci
          git rebase origin/modernize/2026-final-test-ci
          git push origin HEAD:modernize/2026-final-test-ci
      - name: Summarize residual lint
        if: always()
        run: echo "residual-lint=${{ steps.residual.outcome }}"
