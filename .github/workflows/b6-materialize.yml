name: B6 materialize validated migration

on:
  push:
    branches:
      - modernize/2026-ts-dependencies
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b6-materialize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Keep big-bang migration disabled
        run: |
          echo "The Nest 12 / TypeScript major migration is intentionally disabled."
          echo "B6 proceeds through validated compatible groups instead."
