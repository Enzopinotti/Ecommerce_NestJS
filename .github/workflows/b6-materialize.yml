name: B6 materialize validated migration

on:
  push:
    branches:
      - modernize/2026-ts-dependencies
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b6-materialize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Setup pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Stop if migration is already materialized
        id: guard
        shell: bash
        run: |
          if node -e "process.exit(require('./package.json').dependencies['@nestjs/core'] === '12.0.3' ? 0 : 1)"; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Write B6 dependency and TypeScript candidate
        if: steps.guard.outputs.already != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.dependencies = {
            '@nestjs/common': '12.0.3',
            '@nestjs/config': '12.0.0',
            '@nestjs/core': '12.0.3',
            '@nestjs/jwt': '12.0.2',
            '@nestjs/mapped-types': '12.0.0',
            '@nestjs/mongoose': '12.0.0',
            '@nestjs/passport': '12.0.0',
            '@nestjs/platform-express': '12.0.3',
            bcrypt: '6.0.0',
            'class-transformer': '0.5.1',
            'class-validator': '0.14.4',
            'cookie-parser': '1.4.7',
            'express-handlebars': '7.1.3',
            jsonwebtoken: '9.0.3',
            mongoose: '8.24.4',
            'mongoose-paginate-v2': '1.9.5',
            nodemailer: '10.0.10',
            passport: '0.7.0',
            'passport-jwt': '4.0.1',
            'reflect-metadata': '0.2.2',
            rxjs: '7.8.2',
            winston: '3.19.0',
          };
          pkg.devDependencies = {
            '@nestjs/cli': '12.0.3',
            '@nestjs/schematics': '12.0.3',
            '@nestjs/testing': '12.0.3',
            '@types/bcrypt': '6.0.0',
            '@types/cookie-parser': '1.4.10',
            '@types/express': '5.0.6',
            '@types/jest': '29.5.14',
            '@types/node': '24.13.5',
            '@types/passport': '1.0.17',
            '@types/passport-jwt': '4.0.1',
            '@types/supertest': '7.2.1',
            '@typescript-eslint/eslint-plugin': '8.70.0',
            '@typescript-eslint/parser': '8.70.0',
            eslint: '8.57.1',
            'eslint-config-prettier': '9.1.2',
            'eslint-plugin-prettier': '5.5.6',
            jest: '29.7.0',
            prettier: '3.9.8',
            'source-map-support': '0.5.21',
            supertest: '7.2.2',
            'ts-jest': '29.4.12',
            'ts-loader': '9.6.2',
            'ts-node': '10.9.2',
            'tsconfig-paths': '4.2.0',
            typescript: '6.0.3',
          };
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);

          const tsconfig = JSON.parse(fs.readFileSync('tsconfig.json', 'utf8'));
          Object.assign(tsconfig.compilerOptions, {
            module: 'Node16',
            moduleResolution: 'Node16',
            noImplicitAny: true,
            strictNullChecks: true,
            forceConsistentCasingInFileNames: true,
            types: ['node', 'jest'],
          });
          delete tsconfig.compilerOptions.baseUrl;
          fs.writeFileSync('tsconfig.json', `${JSON.stringify(tsconfig, null, 2)}\n`);

          const buildConfig = JSON.parse(fs.readFileSync('tsconfig.build.json', 'utf8'));
          buildConfig.compilerOptions = {
            ...(buildConfig.compilerOptions ?? {}),
            rootDir: './src',
            types: ['node'],
          };
          fs.writeFileSync('tsconfig.build.json', `${JSON.stringify(buildConfig, null, 2)}\n`);
          NODE

          cat > src/utils/handlebarsHelpers.util.ts <<'EOF'
          export const categoryName = (
            categoryMap: Record<string, string> | undefined,
            categoryId: unknown,
          ): string => {
            if (!categoryMap || categoryId === null || categoryId === undefined) {
              return 'Categoría desconocida';
            }

            return categoryMap[String(categoryId)] ?? 'Categoría desconocida';
          };
          EOF

          python3 <<'PY'
          from pathlib import Path

          main = Path('src/main.ts')
          text = main.read_text()
          text = text.replace(
              "import {\n  categoryName,\n  isAdmin,\n  isNotPremium,\n  isPremium,\n} from './utils/handlebarsHelpers.util';",
              "import { categoryName } from './utils/handlebarsHelpers.util';",
          )
          text = text.replace(
              "    helpers: {\n      isAdmin,\n      isNotPremium,\n      isPremium,\n      categoryName,\n    },",
              "    helpers: { categoryName },",
          )
          main.write_text(text)

          environment = Path('src/config/environment.ts')
          text = environment.read_text()
          text = text.replace(
              "  if (options.minLength && value.length < options.minLength) {\n    throw new Error(`${key} must be at least ${options.minLength} characters long`);\n  }",
              "  const minLength = options.minLength;\n  if (minLength !== undefined && value.length < minLength) {\n    throw new Error(`${key} must be at least ${minLength} characters long`);\n  }",
          )
          text = text.replace(
              "  if (!Number.isInteger(candidate) || candidate < 1 || candidate > 65535) {",
              "  if (\n    candidate === undefined ||\n    !Number.isInteger(candidate) ||\n    candidate < 1 ||\n    candidate > 65535\n  ) {",
          )
          environment.write_text(text)

          for filename in [
              'src/products/dto/create-product.dto.ts',
              'src/users/dto/create-user.dto.ts',
              'src/users/entities/user.entity.ts',
          ]:
              path = Path(filename)
              text = path.read_text()
              replacements = {
                  'Array<String>': 'string[]',
                  'String': 'string',
                  'Number': 'number',
                  'Boolean': 'boolean',
              }
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text)
          PY

          cat > src/products/products.module.ts <<'EOF'
          import { Module } from '@nestjs/common';
          import { MongooseModule } from '@nestjs/mongoose';
          import { ProductsController } from './products.controller';
          import { Product, ProductSchema } from './schema/products.schema';
          import { ProductsService } from './products.service';

          @Module({
            imports: [
              MongooseModule.forFeature([
                {
                  name: Product.name,
                  schema: ProductSchema,
                },
              ]),
            ],
            controllers: [ProductsController],
            providers: [ProductsService],
            exports: [ProductsService],
          })
          export class ProductsModule {}
          EOF

          cat > src/categories/categories.module.ts <<'EOF'
          import { Module } from '@nestjs/common';
          import { MongooseModule } from '@nestjs/mongoose';
          import { CategoriesController } from './categories.controller';
          import { CategoriesService } from './categories.service';
          import { Category, CategorySchema } from './schema/categories.schema';

          @Module({
            imports: [
              MongooseModule.forFeature([
                {
                  name: Category.name,
                  schema: CategorySchema,
                },
              ]),
            ],
            controllers: [CategoriesController],
            providers: [CategoriesService],
            exports: [CategoriesService],
          })
          export class CategoriesModule {}
          EOF
      - name: Resolve exact lockfile
        if: steps.guard.outputs.already != 'true'
        run: npm install
      - name: Validate migrated static contract before commit
        if: steps.guard.outputs.already != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run quality:hygiene
          npm run typecheck
          npm run build
          npm run quality:lint-baseline
          npm run quality:unit-baseline
          npm run typecheck:all
          npm audit --omit=dev --audit-level=high
      - name: Commit validated migration
        if: steps.guard.outputs.already != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Enzo Pinotti'
          git config user.email 'enzopinottii@gmail.com'
          git add package.json package-lock.json tsconfig.json tsconfig.build.json src/main.ts src/config/environment.ts src/utils/handlebarsHelpers.util.ts src/products/dto/create-product.dto.ts src/users/dto/create-user.dto.ts src/users/entities/user.entity.ts src/products/products.module.ts src/categories/categories.module.ts
          git diff --cached --check
          git commit -m 'B6: migrate TypeScript and dependency baseline'
          git push origin HEAD:modernize/2026-ts-dependencies
