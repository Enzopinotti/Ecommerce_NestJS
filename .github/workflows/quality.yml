          node-version-file: .nvmrc
          cache: npm
      - name: Install from lockfile
        run: npm ci
      - name: Blocking Mongo integration suite
        id: integration
        run: npm run test:integration
      - name: Blocking HTTP/rendering e2e suite
        id: e2e
        run: npm run test:e2e
      - name: Write B7 suite evidence summary
        if: always()
        shell: bash
        run: |
          {
            echo "# B7 integration/e2e evidence"
            echo "- SHA: `${GITHUB_SHA}`"
            echo "- Mongo image: `mongo:7.0.43-jammy`"
