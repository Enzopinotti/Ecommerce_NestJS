            echo "# B3 authentication evidence"
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- Mongo image: \`mongo:7.0.43-jammy\`"
            echo "- auth contract: \`${{ steps.b3_auth.outcome }}\`"
