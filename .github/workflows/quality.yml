            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- Node: \`$(node --version 2>/dev/null || echo unavailable)\`"
            echo "- npm: \`$(npm --version 2>/dev/null || echo unavailable)\`"
            echo "- Mongo image: \`mongo:7.0.43-jammy\`"
            echo "- domain contract: \`${{ steps.b5_domain.outcome }}\`"
            echo
            echo "The B5 gate validates truthful public endpoints, ObjectId semantics, visible-only catalog reads, bounded product queries and inactive historical cart/user-admin scaffolding."
          } | tee b5-domain-summary.md
          cat b5-domain-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload B5 domain evidence
