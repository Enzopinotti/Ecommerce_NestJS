name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - modernize/2026-nest-quality
      - modernize/2026-config-runtime
      - modernize/2026-auth-authority
      - modernize/2026-recovery-mail
      - modernize/2026-domain-truth
      - modernize/2026-ts-dependencies
      - modernize/2026-final-test-ci
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify toolchain identity
        shell: bash
        run: |
          set -euo pipefail
          expected_node="$(tr -d '\r\n' < .nvmrc)"
          actual_node="$(node --version)"
          expected_npm="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          actual_npm="$(npm --version)"
          printf 'node=%s\n' "$actual_node"
          printf 'npm=%s\n' "$actual_npm"
          printf 'sha=%s\n' "$GITHUB_SHA"
          test "$actual_node" = "$expected_node"
          test "$actual_npm" = "$expected_npm"
      - name: Install from lockfile
        run: npm ci
      - name: Blocking static quality contract
        id: quality
        run: npm run quality
      - name: Blocking production dependency audit
        id: audit_prod
        run: npm run audit:prod
      - name: Write static quality evidence summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Static quality evidence"
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- Node: \`$(node --version 2>/dev/null || echo unavailable)\`"
            echo "- npm: \`$(npm --version 2>/dev/null || echo unavailable)\`"
            echo "- blocking quality: \`${{ steps.quality.outcome }}\`"
            echo "- full-project typecheck: \`blocking inside npm run quality\`"
            echo "- formatting: \`blocking inside npm run quality\`"
            echo "- production audit high: \`${{ steps.audit_prod.outcome }}\`"
          } | tee quality-summary.md
          cat quality-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload static quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: static-quality-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: quality-summary.md

  b2-runtime:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:7.0.43-jammy
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install from lockfile
        run: npm ci
      - name: Blocking B2 production runtime contract
        id: b2_runtime
        env:
          B2_MONGODB_URI: mongodb://127.0.0.1:27017/ecommerce_nestjs_b2
        run: npm run test:b2:runtime
      - name: Write B2 runtime evidence summary
        if: always()
        shell: bash
        run: |
          {
            echo "# B2 runtime evidence"
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- Mongo image: \`mongo:7.0.43-jammy\`"
            echo "- runtime contract: \`${{ steps.b2_runtime.outcome }}\`"
          } | tee b2-runtime-summary.md
          cat b2-runtime-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload B2 runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: b2-runtime-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: b2-runtime-summary.md

  b3-auth-runtime:
