name: B7 formatting normalization

on:
  push:
    branches:
      - modernize/2026-test-architecture
    paths:
      - .github/workflows/b7-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Setup pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install from lockfile
        run: npm ci
      - name: Normalize tracked TypeScript formatting
        run: npm run format:write
      - name: Verify formatting
        run: npm run format:check
      - name: Commit formatting-only normalization
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "Enzo Pinotti"
          git config user.email "enzopinottii@gmail.com"
          git add src test
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git commit -m "B7: normalize TypeScript formatting"
          git fetch origin modernize/2026-test-architecture
          git rebase origin/modernize/2026-test-architecture
          git push origin HEAD:modernize/2026-test-architecture
