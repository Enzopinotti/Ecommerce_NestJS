name: B6 dependency resolver

on:
  push:
    branches:
      - modernize/2026-ts-dependencies
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b6-resolver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install baseline lockfile
        run: npm ci
      - name: Resolve production dependency group
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-exact \
            @nestjs/common@12.0.3 \
            @nestjs/config@12.0.0 \
            @nestjs/core@12.0.3 \
            @nestjs/jwt@12.0.2 \
            @nestjs/mapped-types@12.0.0 \
            @nestjs/mongoose@12.0.0 \
            @nestjs/passport@12.0.0 \
            @nestjs/platform-express@12.0.3 \
            bcrypt@6.0.0 \
            class-transformer@0.5.1 \
            class-validator@0.14.4 \
            cookie-parser@1.4.7 \
            express-handlebars@7.1.3 \
            jsonwebtoken@9.0.3 \
            mongoose@8.24.4 \
            mongoose-paginate-v2@1.9.5 \
            nodemailer@10.0.10 \
            passport@0.7.0 \
            passport-jwt@4.0.1 \
            reflect-metadata@0.2.2 \
            rxjs@7.8.2 \
            winston@3.19.0
      - name: Resolve development dependency group
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-dev --save-exact \
            @nestjs/cli@12.0.3 \
            @nestjs/schematics@12.0.3 \
            @nestjs/testing@12.0.3 \
            @types/bcrypt@6.0.0 \
            @types/cookie-parser@1.4.10 \
            @types/express@5.0.6 \
            @types/jest@29.5.14 \
            @types/node@24 \
            @types/passport@1.0.17 \
            @types/passport-jwt@4.0.1 \
            @types/supertest@7.2.1 \
            @typescript-eslint/eslint-plugin@8.70.0 \
            @typescript-eslint/parser@8.70.0 \
            eslint@8.57.1 \
            eslint-config-prettier@9.1.2 \
            eslint-plugin-prettier@5.5.6 \
            jest@29.7.0 \
            prettier@3.9.8 \
            supertest@7.2.2 \
            ts-jest@29.4.12 \
            ts-loader@9.6.2 \
            ts-node@10.9.2 \
            tsconfig-paths@4.2.0 \
            typescript@5.9.3
          npm uninstall --save-dev @types/winston
      - name: Capture resolved top-level tree
        shell: bash
        run: npm ls --depth=0 > b6-resolved-tree.txt 2>&1
      - name: Capture resolved production audit
        id: audit
        continue-on-error: true
        shell: bash
        run: npm audit --omit=dev --audit-level=high > b6-resolved-audit.txt 2>&1
      - name: Probe build
        id: build
        continue-on-error: true
        run: npm run build
      - name: Probe deployable typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck
      - name: Probe unit suite
        id: unit
        continue-on-error: true
        run: npm run test:unit
      - name: Probe lint
        id: lint
        continue-on-error: true
        run: npm run lint
      - name: Write resolver summary
        if: always()
        shell: bash
        run: |
          {
            echo "# B6 resolved dependency candidate"
            echo "- source SHA: \`${GITHUB_SHA}\`"
            echo "- Node: \`$(node --version)\`"
            echo "- npm: \`$(npm --version)\`"
            echo "- production audit: \`${{ steps.audit.outcome }}\`"
            echo "- build: \`${{ steps.build.outcome }}\`"
            echo "- deployable typecheck: \`${{ steps.typecheck.outcome }}\`"
            echo "- unit suite: \`${{ steps.unit.outcome }}\`"
            echo "- lint: \`${{ steps.lint.outcome }}\`"
          } | tee b6-resolver-summary.md
          cat b6-resolver-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload resolved candidate
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: b6-resolved-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            package.json
            package-lock.json
            b6-resolved-tree.txt
            b6-resolved-audit.txt
            b6-resolver-summary.md
