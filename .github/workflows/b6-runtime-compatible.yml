name: B6 compatible runtime security group

on:
  push:
    branches:
      - modernize/2026-ts-dependencies
    paths:
      - .github/workflows/b6-runtime-compatible.yml

permissions:
  contents: write

jobs:
  apply-runtime-group:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:7.0.43-jammy
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Setup pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install verified type-boundary baseline
        run: npm ci
      - name: Write compatible runtime candidate
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.dependencies = {
            '@nestjs/common': '10.4.22',
            '@nestjs/config': '3.3.0',
            '@nestjs/core': '10.4.22',
            '@nestjs/jwt': '10.2.0',
            '@nestjs/mapped-types': '2.0.5',
            '@nestjs/mongoose': '10.1.0',
            '@nestjs/passport': '10.0.3',
            '@nestjs/platform-express': '10.4.22',
            bcrypt: '6.0.0',
            'class-transformer': '0.5.1',
            'class-validator': '0.14.4',
            'cookie-parser': '1.4.7',
            'express-handlebars': '7.1.3',
            jsonwebtoken: '9.0.3',
            mongoose: '8.24.4',
            'mongoose-paginate-v2': '1.9.5',
            nodemailer: '10.0.10',
            passport: '0.7.0',
            'passport-jwt': '4.0.1',
            'reflect-metadata': '0.2.2',
            rxjs: '7.8.2',
            winston: '3.19.0',
          };
          pkg.devDependencies['@nestjs/cli'] = '10.4.9';
          pkg.devDependencies['@nestjs/schematics'] = '10.2.3';
          pkg.devDependencies['@nestjs/testing'] = '10.4.22';
          delete pkg.devDependencies['@types/nodemailer'];
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install
      - name: Reinstall exact generated graph
        shell: bash
        run: |
          rm -rf node_modules
          npm ci
      - name: Capture production audit
        id: audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > b6-runtime-audit.json
          code=$?
          node - <<'NODE'
          const fs=require('node:fs');
          const audit=JSON.parse(fs.readFileSync('b6-runtime-audit.json','utf8'));
          console.log('production vulnerabilities', audit.metadata?.vulnerabilities ?? {});
          NODE
          echo "audit_exit=$code"
          exit 0
      - name: Verify static and unit contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck:all
          npm run quality:hygiene
          npm run typecheck
          npm run build
          npm run quality:lint-baseline
          npm run quality:unit-baseline
      - name: Verify cumulative runtime contracts
        env:
          B2_MONGODB_URI: mongodb://127.0.0.1:27017/ecommerce_nestjs_b2
          B3_MONGODB_URI: mongodb://127.0.0.1:27017/ecommerce_nestjs_b3
          B4_MONGODB_URI: mongodb://127.0.0.1:27017/ecommerce_nestjs_b4
          B5_MONGODB_URI: mongodb://127.0.0.1:27017/ecommerce_nestjs_b5
        shell: bash
        run: |
          set -euo pipefail
          npm run test:b2:runtime
          npm run test:b3:auth
          npm run test:b4:recovery
          npm run test:b5:domain
      - name: Commit validated runtime group
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "Enzo Pinotti"
          git config user.email "enzopinottii@gmail.com"
          git add package.json package-lock.json
          git commit -m "B6: update compatible runtime security group"
          git fetch origin modernize/2026-ts-dependencies
          git rebase origin/modernize/2026-ts-dependencies
          git push origin HEAD:modernize/2026-ts-dependencies
