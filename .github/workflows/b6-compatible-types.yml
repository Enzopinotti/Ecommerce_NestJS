name: B6 compatible type boundary

on:
  push:
    branches:
      - modernize/2026-ts-dependencies
    paths:
      - .github/workflows/b6-compatible-types.yml

permissions:
  contents: write

jobs:
  apply-compatible-types:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Setup pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install baseline lockfile
        run: npm ci
      - name: Add compatible declaration packages and enable noImplicitAny
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          delete pkg.dependencies['@types/winston'];
          pkg.devDependencies = {
            ...pkg.devDependencies,
            '@types/bcrypt': '6',
            '@types/cookie-parser': '1.4.10',
            '@types/node': '24',
            '@types/nodemailer': '6',
            '@types/passport': '1.0.17',
            '@types/passport-jwt': '4.0.1',
            '@types/supertest': '6.0.3',
          };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');

          const ts = JSON.parse(fs.readFileSync('tsconfig.json', 'utf8'));
          ts.compilerOptions.noImplicitAny = true;
          fs.writeFileSync('tsconfig.json', JSON.stringify(ts, null, 2) + '\n');
          NODE
          npm install
      - name: Pin newly introduced declaration versions exactly
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const names = [
            '@types/bcrypt',
            '@types/cookie-parser',
            '@types/node',
            '@types/nodemailer',
            '@types/passport',
            '@types/passport-jwt',
            '@types/supertest',
          ];
          for (const name of names) {
            const installed = JSON.parse(
              fs.readFileSync(`node_modules/${name}/package.json`, 'utf8'),
            ).version;
            pkg.devDependencies[name] = installed;
            console.log(`${name}=${installed}`);
          }
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only
      - name: Reinstall exact generated lockfile
        shell: bash
        run: |
          rm -rf node_modules
          npm ci
      - name: Verify full project typecheck
        run: npm run typecheck:all
      - name: Verify blocking quality
        run: npm run quality
      - name: Commit reproducible type boundary
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name "Enzo Pinotti"
          git config user.email "enzopinottii@gmail.com"
          git add package.json package-lock.json tsconfig.json
          git commit -m "B6: enable noImplicitAny with explicit declaration packages"
          git push origin HEAD:modernize/2026-ts-dependencies
